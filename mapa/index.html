<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#1e302f}.map{position:relative;height:560px;overflow:hidden;border-radius:14px;background:#e9eee7}.map svg{position:absolute;inset:0;width:100%;height:100%}.map-label{position:absolute;color:#536b5a;font-size:12px;letter-spacing:.04em;font-weight:600;pointer-events:none}.water{fill:#d1e4e3}.block{fill:#dce7d9}.road{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}.road-small{fill:none;stroke:#f8faf6;stroke-width:7;stroke-linecap:round}.route{fill:none;stroke:#75a391;stroke-width:2.5;stroke-dasharray:6 6;opacity:.75}.pin{position:absolute;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:50%;width:34px;height:34px;background:#347d66;color:white;font-weight:800;box-shadow:0 3px 9px #00000026;cursor:pointer;transition:transform .15s,background .15s}.pin:hover,.pin:focus-visible{transform:translate(-50%,-50%) scale(1.17);outline:3px solid #193f36;outline-offset:3px}.pin.selected{background:#172f2b;width:42px;height:42px}.hint{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}.hint span{background:#fff;padding:9px 12px;border-radius:8px;color:#3a5550;font-size:12px;font-weight:700;box-shadow:0 3px 12px #213d2915}.legend{position:absolute;bottom:14px;left:16px;background:#fff;padding:9px 12px;border-radius:8px;font-size:12px;color:#516961;box-shadow:0 3px 12px #213d2915}.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;background:#347d66;margin-right:6px}.location{position:absolute;bottom:14px;right:16px;background:#fff;padding:9px 12px;border-radius:8px;font-size:12px;color:#516961} @media(max-width:600px){.map{height:400px}.hint span:last-child,.location{display:none}.pin{width:32px;height:32px}}
</style></head><body><div class="map" role="group" aria-label="Mapa fictício de pontos de ônibus"><svg viewBox="0 0 800 440" preserveAspectRatio="none" aria-hidden="true"><path class="water" d="M650 -20 C610 60 700 120 660 210 S610 340 675 460 L840 460 L840 -20Z"/><path class="block" d="M25 40h200v82H25zM260 22h140v90H260zM445 30h148v90H445zM42 155h143v100H42zM227 150h160v105H227zM420 151h142v102H420zM35 302h150v96H35zM236 302h158v112H236zM432 301h174v114H432z"/><path class="road" d="M-30 130H630 M-30 278H650 M208 -20V465 M408 -20V465 M610 -20V465"/><path class="road-small" d="M0 55H630 M0 205H630 M0 354H650 M105 0V440 M315 0V440 M510 0V440"/><path class="route" d="M145 276 L298 205 L410 130 L500 278 L610 354"/></svg><div class="map-label" style="left:7%;top:19%">CENTRO</div><div class="map-label" style="left:33%;top:13%">BAIRRO NORTE</div><div class="map-label" style="left:54%;top:78%">REGIÃO LESTE</div><div class="map-label" style="right:8%;top:26%">PARQUE</div><div class="hint"><span>Escolha um ponto no mapa</span><span>Rede simulada</span></div><div id="pins"></div><div class="legend"><b></b> Ponto de ônibus fictício</div><div class="location">Mapa ilustrativo · sem GPS real</div></div><script>
const pts=[['P1','Praça Central',18,63],['P2','Mercado',37,47],['P3','Terminal Norte',51,30],['P4','Universidade',63,63],['P5','Hospital',38,80],['P6','Parque',76,80]];let selected=null;
function send(type,data={}){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*')};function draw(){const el=document.getElementById('pins');el.innerHTML='';pts.forEach(([id,name,x,y])=>{const b=document.createElement('button');b.className='pin'+(selected===id?' selected':'');b.style.left=x+'%';b.style.top=y+'%';b.textContent=id.slice(1);b.title=name+' · '+id;b.setAttribute('aria-label',name+', ponto '+id);b.setAttribute('aria-pressed',selected===id);b.onclick=()=>{selected=id;draw();send('streamlit:setComponentValue',{value:id,dataType:'json'});try{const target=window.parent.document.getElementById('analises-ponto');if(target)target.scrollIntoView({behavior:'smooth',block:'start'})}catch(_error){}};el.appendChild(b)})};window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){if(e.data.args.selected!==selected){selected=e.data.args.selected||null;draw()}send('streamlit:setFrameHeight',{height:document.querySelector('.map').offsetHeight})}});window.addEventListener('resize',()=>send('streamlit:setFrameHeight',{height:document.querySelector('.map').offsetHeight}));draw();send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:document.querySelector('.map').offsetHeight});
</script></body></html>
